name: build-derived

on:
  workflow_call:
    inputs:
      context:
        description: Build context containing the Dockerfile
        type: string
        default: .
      image-name:
        description: Target image, e.g. ghcr.io/kamphaus/notepadpp
        type: string
        required: true
      test-command:
        description: Shell command run in command mode inside the image; must exit 0
        type: string
        default: 'true'
      base-image-artifact:
        description: Optional artifact name holding image.tar.gz (docker save, gzipped) to load before building
        type: string
        default: ''
      base-image:
        description: Optional BASE_IMAGE build-arg value (for example the locally loaded image)
        type: string
        default: ''
      artifact-name:
        description: Name of the artifact carrying the tested image to the publish job; make it unique per call
        type: string
        default: derived-image
      push:
        description: Push, attest and sign after the tests pass
        type: boolean
        default: false

permissions:
  contents: read

env:
  # renovate: datasource=docker depName=aquasec/trivy
  TRIVY_IMAGE: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa

jobs:
  build-test:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.base-image-artifact != ''
        with:
          name: ${{ inputs.base-image-artifact }}
          path: base-image
      - name: Load base image
        if: inputs.base-image-artifact != ''
        run: gunzip -c base-image/image.tar.gz | docker load
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          load: true
          tags: derived:ci
          build-args: ${{ inputs.base-image != '' && format('BASE_IMAGE={0}', inputs.base-image) || '' }}
      - name: Smoke test (desktop under an arbitrary UID, then the test command)
        env:
          TEST_COMMAND: ${{ inputs.test-command }}
        run: |
          docker run -d --name derived-smoke --user 123456:0 --read-only --cap-drop ALL \
            --security-opt no-new-privileges --tmpfs /tmp:mode=1777 --tmpfs /run/desktop:mode=0770 \
            --tmpfs /home/wineuser:mode=0770 --shm-size 1g derived:ci
          for _ in $(seq 300); do
            docker exec derived-smoke /usr/local/bin/desktop healthcheck >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec derived-smoke /usr/local/bin/desktop healthcheck || { docker logs derived-smoke; exit 1; }
          docker rm -f derived-smoke
          docker run --rm --user 123456:0 --tmpfs /home/wineuser:mode=0770 derived:ci bash -c "$TEST_COMMAND"
      - name: Scan
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE"
          image --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 derived:ci
      - name: Save tested image
        if: inputs.push
        run: docker save derived:ci | gzip > image.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.push
        with:
          name: ${{ inputs.artifact-name }}
          path: image.tar.gz
          retention-days: 1
          compression-level: 0

  publish:
    needs: build-test
    if: inputs.push
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE_NAME: ${{ inputs.image-name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact-name }}
      - name: Load and tag
        id: tag
        run: |
          gunzip -c image.tar.gz | docker load
          version="${GITHUB_SHA::7}"
          docker tag derived:ci "$IMAGE_NAME:$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        id: push
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          docker push "$IMAGE_NAME:$VERSION"
          digest=$(docker buildx imagetools inspect "$IMAGE_NAME:$VERSION" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Published \`$IMAGE_NAME:$VERSION@$digest\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Generate SBOM
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/out" "$TRIVY_IMAGE"
          image --format spdx-json --output /out/sbom.spdx.json "$IMAGE_NAME:$VERSION"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ inputs.image-name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ inputs.image-name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign and verify
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE_NAME@$DIGEST"
          cosign verify "$IMAGE_NAME@$DIGEST" \
            --certificate-identity-regexp '^https://github\.com/kamphaus/docker-wine/\.github/workflows/build-derived\.yml@' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null
      - name: Publish moving tag
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          docker tag "$IMAGE_NAME:$VERSION" "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:latest"
