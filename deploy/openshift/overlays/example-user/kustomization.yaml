apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namePrefix: alice-
resources:
  - ../../base
  - rolebinding.yaml
components:
  - ../../components/egress-deny
patches:
  - target:
      kind: PersistentVolumeClaim
      name: wine-desktop-home
    patch: |-
      - op: replace
        path: /spec/resources/requests/storage
        value: 50Gi
  - target:
      kind: Deployment
      name: wine-desktop
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: ephemeral
